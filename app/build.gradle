plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nijagent.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nijagent.app'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '7.1'
    }

    // Fixed signing key: har naya APK purane ke upar install ho jata hai (data + skills bache rehte hain).
    signingConfigs {
        release {
            storeFile file('../nijagent.keystore')
            storePassword 'nijagent123'
            keyAlias 'nijagent'
            keyPassword 'nijagent123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
